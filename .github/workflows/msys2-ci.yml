name: MSYS2 CI

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "*" ]

env:
  # Pin the FPC RTL/compiler source revision used by the pp.pas bootstrap job.
  # Keep in sync with .github/workflows/ci.yml.
  FPCSOURCE_COMMIT: 812f8fb69cb7088bd33f5387da74a80b5cf1d464

jobs:
  msys2-build-test:
    strategy:
      fail-fast: false
      matrix:
        sys: [MSYS, MINGW64, UCRT64, CLANG64]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: base-devel git flex bison gmp-devel
        pacboy: >-
          ${{ matrix.sys != 'MSYS' && 'cc:p' || 'gcc' }}
          meson:p
          ninja:p
          python:p
          gmp:p

    - name: Enable Windows crash dumps
      shell: pwsh
      run: |
        # Configure WER to save full dumps on crash
        $dumpDir = "${{ github.workspace }}\crashdumps"
        New-Item -Path $dumpDir -ItemType Directory -Force
        $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
        New-Item -Path $regPath -Force
        Set-ItemProperty -Path $regPath -Name "DumpFolder" -Value $dumpDir
        Set-ItemProperty -Path $regPath -Name "DumpType" -Value 2  # Full dump
        Set-ItemProperty -Path $regPath -Name "DumpCount" -Value 10
        Write-Output "Crash dumps will be saved to $dumpDir"

    - name: Configure build
      shell: msys2 {0}
      run: meson setup builddir --buildtype=release -Dwith_gmp=enabled

    - name: Build
      shell: msys2 {0}
      run: meson compile -C builddir

    - name: Run tests
      shell: msys2 {0}
      env:
        # Meson test() sets workdir to the project source root, so this must be source-root relative.
        KGPC_CI_FAILURE_DIR: builddir/failing-tests
        # Enable verbose test logging to identify hanging tests
        KGPC_TEST_VERBOSE: "1"
      run: |
        rm -rf builddir/failing-tests failing-tests
        meson test -v -C builddir

    - name: Upload meson logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: meson-logs-${{ matrix.sys }}
        path: |
          builddir/meson-logs/
          builddir/failing-tests/
          builddir/debug/clang64/logs/
        if-no-files-found: ignore

    - name: Upload crash dumps
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: crash-dumps-${{ matrix.sys }}
        path: ${{ github.workspace }}/crashdumps/
        if-no-files-found: ignore

  # Native Win64 FPC self-host probe: compile the FPC compiler (pp.pas) with
  # the KGPC built under UCRT64.  This is the environment where the native
  # Windows self-host fixpoint was reached, so it guards the Win64 codegen
  # path that the rest of this branch fixed.  Runs only the bootstrap subtest,
  # not the full RTL suite.
  fpc-bootstrap:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: base-devel git flex bison gmp-devel
        pacboy: >-
          cc:p
          meson:p
          ninja:p
          python:p
          gmp:p

    - name: Cache FPC RTL source
      id: cache-fpcsource
      uses: actions/cache@v5
      with:
        path: FPCSource
        key: fpcsource-msys2-${{ env.FPCSOURCE_COMMIT }}

    - name: Clone FPC RTL source
      if: steps.cache-fpcsource.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/fpc/FPCSource.git FPCSource
        cd FPCSource
        git checkout ${{ env.FPCSOURCE_COMMIT }}

    - name: Configure FPC RTL build
      shell: msys2 {0}
      run: meson setup build-fpc --buildtype=release -Dwith_gmp=enabled -Drun_fpc_rtl_tests=true

    - name: Build
      shell: msys2 {0}
      run: meson compile -C build-fpc

    - name: Run pp.pas bootstrap test
      shell: msys2 {0}
      run: meson test -v -C build-fpc "FPC pp.pas bootstrap"

    - name: Upload meson logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: meson-logs-fpc-bootstrap-ucrt64
        path: build-fpc/meson-logs/
        if-no-files-found: ignore
