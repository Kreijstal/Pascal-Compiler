name: cppcheck

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "master", "copilot/**" ]
  workflow_dispatch:

jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison libfl-dev libunwind-dev libgmp-dev cppcheck
        pip install meson ninja

    - name: Configure build
      run: meson setup builddir --buildtype=debugoptimized -Dwith_gmp=enabled

    - name: Run cppcheck
      run: meson compile -C builddir cppcheck
